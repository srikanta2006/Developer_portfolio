<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F7F6F2" rx="14" />
  <rect x="20" y="20" width="760" height="460" fill="#FFFFFF" rx="10" stroke="#E8E5DD" stroke-width="2" stroke-dasharray="6 6" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="40" fill="#F0EDE6" rx="10 10 0 0" />
  <circle cx="45" cy="40" r="5" fill="#E8E5DD" />
  <circle cx="62" cy="40" r="5" fill="#E8E5DD" />
  <circle cx="79" cy="40" r="5" fill="#E8E5DD" />
  <text x="400" y="44" font-family="monospace" font-size="12" fill="#706E6B" text-anchor="middle">
    hackos-workspace.preview
  </text>

  <!-- Workspace Cockpit Mock -->
  <rect x="60" y="90" width="210" height="300" fill="#F0EEFE" rx="8" />
  <text x="165" y="140" font-family="monospace" font-size="13" fill="#6D5DFB" text-anchor="middle" font-weight="600">
    TIMER / SPRINT
  </text>
  <text x="165" y="190" font-family="monospace" font-size="28" fill="#171717" text-anchor="middle" font-weight="700">
    23:59:42
  </text>
  
  <rect x="290" y="90" width="450" height="140" fill="#F7F6F2" rx="8" />
  <text x="515" y="150" font-family="sans-serif" font-size="16" fill="#171717" font-weight="600" text-anchor="middle">
    HackOS Productivity Cockpit
  </text>
  <text x="515" y="175" font-family="sans-serif" font-size="12" fill="#706E6B" text-anchor="middle">
    Unified Task Sync, Scratchpad & Milestone Tracking
  </text>
  
  <rect x="290" y="250" width="450" height="140" fill="#F2F5EF" rx="8" />
  
  <!-- Label -->
  <rect x="260" y="415" width="280" height="28" rx="6" fill="#FFFFFF" stroke="#E8E5DD" />
  <text x="400" y="433" font-family="monospace" font-size="11" fill="#706E6B" text-anchor="middle" font-weight="600">
    SCREENSHOT PLACEHOLDER
  </text>
</svg>
